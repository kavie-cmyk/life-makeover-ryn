name: Validate app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check catalog.js
          node --check detail-hooks.js
          node --check upgrade-recommend.js
          node --check farm-scan.js
          node --check scripts/build-farmable-catalog.mjs
          node --check scripts/build-farmable-catalog-safe.mjs
      - name: Verify required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f catalog.js
          test -f detail-hooks.js
          test -f upgrade-recommend.js
          test -f farm-scan.js
          test -f scripts/build-farmable-catalog.mjs
          test -f scripts/build-farmable-catalog-safe.mjs
