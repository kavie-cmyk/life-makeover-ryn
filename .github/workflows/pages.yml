name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build farmable Wiki catalog
        run: node scripts/build-farmable-catalog-safe.mjs

      - name: Prepare deployed HTML
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          let html = fs.readFileSync('index.html', 'utf8');
          if (!html.includes('farm-scan.js')) {
            const version = process.env.GITHUB_SHA?.slice(0, 12) || Date.now();
            html = html.replace('</body>', `  <script src="farm-scan.js?v=${version}"></script>\n</body>`);
            fs.writeFileSync('index.html', html);
          }
          if (!fs.existsSync('data/farmable-catalog.json')) process.exit(2);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
